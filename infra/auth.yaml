AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings app - Cognito user pool: sign-in with email and password (self sign-up, email
  verification code), a public app client for the SPA, a Cognito domain for OAuth, and Google
  as an identity provider that is created only when GoogleClientId is set.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    AllowedPattern: "[a-z][a-z0-9-]*"
  AppUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173,http://localhost:3000
    Description: >-
      Origins of the frontend (no trailing slash). OAuth (Google) redirects back to
      <origin>/login. Kept up to date by the infra scripts.
  GoogleClientId:
    Type: String
    Default: ""
    Description: Google OAuth client id; leave empty to keep Google sign-in disabled.
  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]

Resources:
  # Retained on delete and replace: deleting the pool deletes every account in it.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      UserPoolTier: ESSENTIALS
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      # Users sign in with their email; Cognito emails a code to verify it.
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      # A new email (profile page) takes effect only after its code is entered; until then
      # the user keeps signing in with, and recovering the password through, the old one.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      UsernameConfiguration:
        CaseSensitive: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      # Mirrored by the signup form (frontend/src/pages/signup-page.tsx).
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      # Cognito's own sender: no SES setup, limited to about 50 emails a day.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your Meetings verification code
        EmailMessage: "Your Meetings verification code is {####}"
      UserPoolTags:
        PROJECT_NAME: !Ref ProjectName

  # Hosted domain for the OAuth endpoints (needed for Google and Managed Login). Prefixes are global.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub ${ProjectName}-${AWS::AccountId}
      ManagedLoginVersion: 2

  ManagedLoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DependsOn: UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: openid email profile
      AttributeMapping:
        email: email
        email_verified: email_verified
        name: name

  # Public client (no secret): the SPA talks to Cognito directly with SRP.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${ProjectName}-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      # Referencing the provider (its Ref is "Google") makes the client wait for it.
      SupportedIdentityProviders: !If
        - HasGoogle
        - [COGNITO, !Ref GoogleIdentityProvider]
        - [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      # Allow <origin>/login, <origin>/login/, and <origin>/ for every origin.
      CallbackURLs: !Split
        - ","
        - !Join
          - ","
          - - !Join ["", [!Join ["/login,", !Ref AppUrls], "/login"]]
            - !Join ["", [!Join ["/login/,", !Ref AppUrls], "/login/"]]
            - !Join ["", [!Join ["/,", !Ref AppUrls], "/"]]
      LogoutURLs: !Split
        - ","
        - !Join
          - ","
          - - !Join ["", [!Join ["/login,", !Ref AppUrls], "/login"]]
            - !Join ["", [!Join ["/login/,", !Ref AppUrls], "/login/"]]
            - !Join ["", [!Join ["/,", !Ref AppUrls], "/"]]

Outputs:
  Region:
    Value: !Ref AWS::Region
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Domain:
    Description: Cognito domain for OAuth redirects (Google)
    Value: !Sub ${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com
  Issuer:
    Description: Issuer of the tokens; the backend checks it
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  GoogleEnabled:
    Value: !If [HasGoogle, "true", "false"]
