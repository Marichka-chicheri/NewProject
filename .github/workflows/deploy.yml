name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  lint:
    name: Lint & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend sync & ruff
        run: |
          cd backend
          uv sync --locked
          uv run ruff check .

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend sync & build
        run: |
          cd frontend
          npm ci
          npx prettier --check .
          npm run build

  deploy:
    name: Deploy to AWS
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure .env
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cp .env.example .env
          sed -i "s|^AWS_ACCESS_KEY_ID=.*|AWS_ACCESS_KEY_ID=${AWS_KEY}|" .env
          sed -i "s|^AWS_SECRET_ACCESS_KEY=.*|AWS_SECRET_ACCESS_KEY=${AWS_SECRET}|" .env
          sed -i "s|^AWS_REGION=.*|AWS_REGION=us-east-1|" .env
          sed -i "s|^PROJECT_NAME=.*|PROJECT_NAME=new-project|" .env
          sed -i "s|^DOMAIN_NAME=.*|DOMAIN_NAME=app.mary-meetings.online|" .env
          sed -i "s|^COGNITO_USER_POOL_ID=.*|COGNITO_USER_POOL_ID=us-east-1_ZFOrr7yex|" .env
          sed -i "s|^COGNITO_CLIENT_ID=.*|COGNITO_CLIENT_ID=5mmqgvit3tnnq2u7uie2mu09f9|" .env
          sed -i "s|^COGNITO_DOMAIN=.*|COGNITO_DOMAIN=new-project-274394226432.auth.us-east-1.amazoncognito.com|" .env
          sed -i "s|^COGNITO_GOOGLE_ENABLED=.*|COGNITO_GOOGLE_ENABLED=false|" .env

      - name: Deploy Backend
        run: make deploy-backend

      - name: Deploy Frontend
        run: make deploy-frontend
